<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="clawd">
<meta name="theme-color" content="#D2E1EC">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>clawd</title>
<style>
:root{
  --text:#4A4F42; --soft:#7A7F72; --accent:#F9A282; --accent-soft:#FCDACC; --accent-deep:#B5532F;
  --side:#D2E1EC; --bg:#E4EDF4; --field:#EFF4F8; --line:#C2D1DC; --strong:#4A4F42;
  --mono:"Courier New",Courier,"PingFang SC","Hiragino Sans GB",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--mono);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;border-radius:0}
button{border:none;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.app{display:flex;height:100vh;height:100dvh}

/* sidebar */
.side{width:200px;flex-shrink:0;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
.brand{padding:0 20px 24px;font-size:22px;font-weight:700}
.nav{flex:1;overflow-y:auto}
.nav-btn{display:flex;align-items:center;width:100%;height:46px;padding:0 20px;font-size:15px;text-align:left;-webkit-user-select:none;user-select:none}
.nav-btn:active{background:rgba(74,79,66,.07)}
.nav-btn.active{background:var(--accent)}
.nav-btn .n{margin-left:auto;font-size:12px;color:var(--soft)}
.nav-btn.active .n{color:var(--text)}
.side-foot{border-top:1px solid var(--line);padding-top:8px}
.foot-btn{display:block;width:100%;height:40px;padding:0 20px;font-size:13px;text-align:left}
.foot-btn:active{background:rgba(74,79,66,.07)}
.hint{padding:4px 20px 0;font-size:11px;color:var(--soft)}
.hint.warn{color:var(--accent-deep)}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:860px;margin:0 auto;padding-left:28px;padding-right:calc(28px + env(safe-area-inset-right))}
.top{flex-shrink:0}
.head{display:flex;align-items:flex-end;gap:12px;padding:calc(24px + env(safe-area-inset-top)) 0 14px;border-bottom:1px solid var(--strong)}
.head-text{flex:1;min-width:0}
.head h1{font-size:22px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .sub{margin-top:4px;font-size:12px;letter-spacing:.08em;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head-actions{display:flex;gap:8px;align-items:center}
.plus{position:relative;flex-shrink:0;width:40px;height:40px;border:1px solid var(--text)}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;background:var(--text);transform:translate(-50%,-50%)}
.plus::before{width:16px;height:1px}
.plus::after{width:1px;height:16px}
.plus:active{background:var(--accent)}
.tbtn{height:36px;padding:0 12px;border:1px solid var(--text);font-size:13px}
.tbtn:active{background:var(--accent-soft)}
.tbtn.main{background:var(--accent)}
.tbtn.danger{color:var(--accent-deep);border-color:var(--accent-deep)}
.search-bar{padding-top:12px}
.search{width:100%;height:38px;padding:0 12px;border:1px solid var(--line);background:var(--field);font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.search:focus{border-color:var(--text)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.content{padding-top:4px;padding-bottom:calc(48px + env(safe-area-inset-bottom))}

/* rows */
.sec{display:flex;align-items:baseline;gap:10px;margin-top:22px;padding-bottom:6px;border-bottom:1px solid var(--strong);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.sec b{color:var(--text)}
.sec .act{margin-left:auto;padding:4px 0;font-size:12px;letter-spacing:0;text-transform:none;color:var(--accent-deep)}
.sub-sec{padding:12px 0 2px;font-size:11px;letter-spacing:.12em;color:var(--soft)}
.row{display:flex;align-items:center;gap:14px;min-height:54px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:rgba(74,79,66,.04)}
.row-body{flex:1;min-width:0}
.t{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.wrap-t{white-space:normal;word-break:break-word}
.s{margin-top:2px;font-size:12px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p{margin-top:3px;font-size:13px;color:var(--soft);word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.warn{color:var(--accent-deep)}
.empty{padding:60px 0;text-align:center;font-size:13px;color:var(--soft)}
.hint-row{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--soft)}
.tag{display:inline-block;margin-right:8px;padding:0 6px;border:1px solid var(--accent);font-size:11px;color:var(--accent-deep)}
.row.cta{margin-top:16px;padding:12px 14px;border:1px solid var(--accent);background:var(--accent-soft)}
.row.hl{background:var(--accent-soft)}
.row.past{opacity:.6}

/* to-do */
.chk{flex-shrink:0;display:grid;place-items:center;width:44px;height:44px;margin:-10px -10px -10px -12px}
.chk i{position:relative;display:block;width:18px;height:18px;border:1px solid var(--text)}
.chk.on i{background:var(--accent);border-color:var(--accent)}
.chk.on i::after,.task.on .tbox::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--text);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.row.done .t{text-decoration:line-through;color:var(--soft)}
.mini{flex-shrink:0;height:30px;padding:0 10px;border:1px solid var(--line);font-size:12px}
.mini:active{background:var(--accent-soft)}

/* progress */
.folder{border-bottom:1px solid var(--strong)}
.frow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;cursor:pointer}
.chev{flex-shrink:0;width:9px;height:9px;margin:0 4px;border:solid var(--text);border-width:0 1px 1px 0;transform:rotate(-45deg);transition:transform .15s}
.folder.open .chev{transform:rotate(45deg)}
.fname{flex:1;min-width:0;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-size:15px}
.bar{height:3px;background:var(--side)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.fitems{padding:0 0 10px 26px}
.line{display:flex;align-items:baseline;gap:10px}
.line .t{flex:1}
.prow .bar{margin:6px 0 4px}
.step{display:flex}
.sq{flex-shrink:0;display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);font-size:17px;line-height:1}
.sq+.sq{margin-left:-1px}
.sq:active{background:var(--accent-soft)}
.sq.dots{border-color:transparent;color:var(--soft);font-size:14px}

/* journal / bookmarks / countdown */
.jday{flex-shrink:0;width:48px}
.jday b{display:block;font-size:24px;font-weight:400;line-height:1}
.jday span{font-size:11px;letter-spacing:.1em;color:var(--soft)}
.fav{flex-shrink:0;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--text);font-size:15px;font-weight:700}
.cd{flex-shrink:0;text-align:right}
.cd b{display:block;font-size:28px;font-weight:400;line-height:1;color:var(--accent-deep)}
.cd span{font-size:11px;letter-spacing:.1em;color:var(--soft)}
.row.past .cd b{color:var(--soft)}

/* document view */
.doc-title{margin-top:20px;font-size:22px;font-weight:700;line-height:1.3;word-break:break-word}
.md{margin-top:16px;font-size:15px;line-height:1.75;word-break:break-word}
.md>*+*{margin-top:.8em}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin-top:1.4em;font-weight:700;line-height:1.35}
.md>:first-child{margin-top:0}
.md h1{font-size:20px}.md h2{font-size:17px}.md h3,.md h4,.md h5,.md h6{font-size:15px}
.md ul,.md ol{padding-left:1.6em}
.md li+li{margin-top:.25em}
.md li.task{display:flex;gap:10px;align-items:flex-start;margin-left:-1.6em;list-style:none}
.tbox{position:relative;flex-shrink:0;width:16px;height:16px;margin-top:.4em;border:1px solid var(--text);cursor:pointer}
.tbox::before{content:"";position:absolute;inset:-12px}
.task.on .tbox{background:var(--accent);border-color:var(--accent)}
.task.on .tbox::after{left:4px;top:0}
.task.on>span:last-child{text-decoration:line-through;color:var(--soft)}
.md blockquote{padding-left:14px;border-left:2px solid var(--accent);color:var(--soft)}
.md code{padding:1px 4px;background:var(--side);font-size:.93em}
.md pre{padding:12px 14px;background:var(--side);overflow-x:auto;font-size:13px;line-height:1.5}
.md pre code{padding:0;background:none}
.md img{display:block;max-width:100%;height:auto;border:1px solid var(--line)}
.md hr{border:none;border-top:1px solid var(--strong)}
.md a{color:var(--accent-deep);text-decoration:underline;text-underline-offset:2px}
.md del{color:var(--soft)}
.done-list{margin-top:8px;padding-left:1.4em;font-size:14px;line-height:1.8;color:var(--soft);text-decoration:line-through}

/* editor */
.ed-title,.ed-tag{display:block;width:100%;padding:6px 0;border:none;border-bottom:1px solid var(--line);background:transparent;outline:none}
.ed-title{margin-top:18px;font-size:22px;font-weight:700}
.ed-tag{font-size:13px}
.mdbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;margin-top:14px;background:var(--bg);border:1px solid var(--line)}
.mdbar button{height:38px;padding:0 12px;border-right:1px solid var(--line);font-size:13px}
.mdbar button:active{background:var(--accent-soft)}
.ed-body{display:block;width:100%;min-height:55vh;margin-top:-1px;padding:14px;border:1px solid var(--line);background:var(--field);font-size:15px;line-height:1.7;outline:none;resize:none;overflow:hidden;-webkit-appearance:none;appearance:none}

/* modal */
.mask{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(74,79,66,.3)}
.mask.show{display:flex}
.sheet{width:100%;max-width:480px;max-height:100%;overflow-y:auto;padding:22px 24px;background:var(--bg);border:1px solid var(--text)}
.sheet h2{margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--text);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.msg{font-size:13px;line-height:1.7}
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.field input{width:100%;height:42px;padding:0 10px;border:1px solid var(--line);background:var(--field);font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:var(--text)}
.field input[type=date]{display:block;line-height:42px;text-align:left}
.seg{display:flex;border:1px solid var(--text)}
.seg button{flex:1;height:38px;font-size:13px}
.seg button+button{border-left:1px solid var(--text)}
.seg button.on{background:var(--accent)}
.actions{display:flex;gap:8px;margin-top:20px}
.actions .sp{flex:1}

@media (max-width:640px){
  .side{width:124px}
  .brand{padding:0 14px 18px;font-size:18px}
  .nav-btn,.foot-btn{padding:0 14px;font-size:13px}
  .nav-btn .n{display:none}
  .hint{padding:4px 14px 0}
  .wrap{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">clawd</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="foot-btn" id="exportBtn">Export</button>
      <button class="foot-btn" id="importBtn">Import</button>
      <div class="hint" id="backupHint"></div>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
      <input type="file" id="imgInput" accept="image/*" multiple hidden>
    </div>
  </aside>
  <main class="main">
    <div class="wrap top">
      <header class="head">
        <div class="head-text"><h1 id="title"></h1><div class="sub" id="sub"></div></div>
        <div class="head-actions" id="headActions"></div>
      </header>
      <div class="search-bar" id="searchBar" hidden><input class="search" id="search" type="search" placeholder="Search"></div>
    </div>
    <div class="scroll" id="scroll"><div class="wrap content" id="list"></div></div>
  </main>
</div>

<div class="mask" id="mask">
  <form class="sheet" id="sheet" novalidate autocomplete="off">
    <h2 id="sheetTitle"></h2>
    <div id="fields"></div>
    <div class="actions">
      <button type="button" class="tbtn danger" id="delBtn">Delete</button>
      <span class="sp"></span>
      <button type="button" class="tbtn" id="cancelBtn">Cancel</button>
      <button type="submit" class="tbtn main">Save</button>
    </div>
  </form>
</div>

<div class="mask" id="exportMask">
  <div class="sheet">
    <h2>Export backup</h2>
    <p class="msg" id="exportMsg"></p>
    <div class="actions">
      <span class="sp"></span>
      <button type="button" class="tbtn" id="exportCancel">Cancel</button>
      <button type="button" class="tbtn main" id="exportSave">Save file</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = n => Number.isInteger(n) ? n : +(+n).toFixed(2);

/* ---------- dates ---------- */
const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const MONTH = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const toDate = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const mondayOf = s => addDays(s, -((toDate(s).getDay() + 6) % 7));
function diffDays(a, b) { // b - a, in days
  const x = toDate(a), y = toDate(b);
  return Math.round((Date.UTC(y.getFullYear(), y.getMonth(), y.getDate()) - Date.UTC(x.getFullYear(), x.getMonth(), x.getDate())) / 86400000);
}
function isoWeek(s) {
  const d = toDate(s), t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
}
const fmtLong = s => { const d = toDate(s); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtShort = s => { const d = toDate(s); return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtMD = s => { const d = toDate(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
function fmtStamp(ts) {
  const d = new Date(ts || Date.now()), now = new Date();
  const day = `${MON[d.getMonth()]} ${d.getDate()}` + (d.getFullYear() === now.getFullYear() ? '' : `, ${d.getFullYear()}`);
  return `${day} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- urls ---------- */
function safeHref(s) {
  try { const u = new URL(s); return /^https?:$/.test(u.protocol) ? u.href : null; } catch { return null; }
}
const normalizeUrl = s => safeHref(/^[a-z][a-z0-9+.-]*:/i.test(s) ? s : 'https://' + s);
const hostOf = u => { try { return new URL(u).host; } catch { return u; } };

/* ---------- IndexedDB ---------- */
const store = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('clawd', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('images'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (name, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const tx = d.transaction(name, mode), req = fn(tx.objectStore(name));
      tx.oncomplete = () => res(req ? req.result : undefined);
      tx.onerror = tx.onabort = () => rej(tx.error);
    });
  };
  return {
    get: (n, k) => run(n, 'readonly', s => s.get(k)),
    put: (n, k, v) => run(n, 'readwrite', s => s.put(v, k)),
  };
})();

/* ---------- data ---------- */
const OLD_KEY = 'study-dashboard-v1', UI_KEY = 'clawd-ui', EXPORT_KEY = 'clawd-lastExport';
const emptyDB = () => ({ version: 2, todos: [], notes: [], folders: [], journal: [], bookmarks: [], countdowns: [] });
let db = emptyDB();
const safeJSON = s => { try { return JSON.parse(s) || {}; } catch { return {}; } };
const ui = Object.assign({ tab: 'todos', doneOpen: false }, safeJSON(localStorage.getItem(UI_KEY)));
const saveUI = () => localStorage.setItem(UI_KEY, JSON.stringify(ui));

const objs = x => Array.isArray(x) ? x.filter(o => o && typeof o === 'object').map(o => ({ ...o, id: String(o.id || uid()) })) : [];
function normalize(d) {
  const out = emptyDB();
  if (!d || typeof d !== 'object') return out;
  for (const k of ['notes', 'journal', 'bookmarks', 'countdowns']) out[k] = objs(d[k]);
  out.folders = objs(d.folders).map(f => ({ ...f, name: String(f.name || 'Untitled'), items: objs(f.items) }));
  out.todos = objs(d.todos).map(t => {
    const scope = t.scope === 'week' ? 'week' : 'day';
    const date = validDate(t.date) ? t.date : today();
    return { ...t, text: String(t.text || ''), scope, date: scope === 'week' ? mondayOf(date) : date, done: !!t.done, rolled: +t.rolled || 0 };
  });
  out.journal = out.journal.filter(j => validDate(j.date));
  return out;
}
function migrateV1(d) { // data from the first version (study dashboard)
  d = d && d.data ? d.data : d;
  const n = emptyDB();
  if (!d || typeof d !== 'object') return n;
  n.todos = objs(d.todos).map(t => ({
    id: t.id, text: String(t.text || ''), scope: 'day', date: validDate(t.due) ? t.due : today(),
    done: !!t.done, doneDate: t.done ? ymd(new Date(t.updated || Date.now())) : null, doneAt: t.done ? (t.updated || Date.now()) : 0,
    rolled: 0, created: t.created || Date.now(),
  }));
  n.notes = objs(d.notes).map(x => ({ id: x.id, title: String(x.title || ''), tag: String(x.tag || ''), content: String(x.content || ''), created: x.created || Date.now(), updated: x.updated || x.created || Date.now() }));
  const items = objs(d.progress).map(p => ({ id: p.id, name: String(p.name || ''), current: +p.current || 0, total: +p.total || 1, unit: String(p.unit || '') }));
  if (items.length) n.folders.push({ id: uid(), name: 'General', open: true, items });
  n.bookmarks = objs(d.bookmarks);
  n.countdowns = objs(d.countdowns);
  return n;
}

let saveErrShown = false, saveTimer = null;
function save() {
  return store.put('kv', 'db', db).catch(e => {
    if (!saveErrShown) { saveErrShown = true; alert('Save failed. Export a backup now.\n' + (e && e.message || e)); }
  });
}
function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; save(); }, 500); }
function flushSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; save(); } }

/* ---------- images ---------- */
const imgCache = new Map();
async function getImage(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  const v = await store.get('images', id).catch(() => null);
  if (v) imgCache.set(id, v);
  return v;
}
async function putImage(dataUrl) {
  const id = uid();
  await store.put('images', id, dataUrl);
  imgCache.set(id, dataUrl);
  return id;
}
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('unsupported image')); i.src = url; });
    const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));

      i++;

  if (!isNote) {
    const done = db.todos.filter(t => t.done && t.doneDate === r.date);
    if (done.length) h += sec('Done that day', done.length) + `<ul class="done-list">${done.map(t => `<li>${esc(t.text)}</li>`).join('')}</ul>`;
  }
  $('list').innerHTML = h;
  fillImages($('list'));
}
function replaceRange(ta, start, end, text, selS, selE) {
  ta.focus();
  ta.setRangeText(text, start, end);
  ta.setSelectionRange(selS, selE);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
function wrapSel(ta, a, b, ph) {
  const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e) || ph;
  replaceRange(ta, s, e, a + sel + b, s + a.length, s + a.length + sel.length);
}
function linePrefix(ta, p) {
  const s = ta.selectionStart, e = ta.selectionEnd, ls = ta.value.lastIndexOf('\n', s - 1) + 1;
  replaceRange(ta, ls, ls, p, s + p.length, e + p.length);
}
function mdAction(k) {
  const ta = $('edBody');
  if (!ta) return;
  const multi = ta.value.slice(ta.selectionStart, ta.selectionEnd).includes('\n');
  switch (k) {
    case 'h': return linePrefix(ta, '## ');
    case 'b': return wrapSel(ta, '**', '**', 'bold');
    case 'i': return wrapSel(ta, '*', '*', 'italic');
    case 's': return wrapSel(ta, '~~', '~~', 'text');
    case 'ul': return linePrefix(ta, '- ');
    case 'task': return linePrefix(ta, '- [ ] ');
    case 'quote': return linePrefix(ta, '> ');
    case 'code': return multi ? wrapSel(ta, '\n```\n', '\n```\n', 'code') : wrapSel(ta, '`', '`', 'code');
    case 'link': return wrapSel(ta, '[', '](https://)', 'text');
    case 'img': return $('imgInput').click();
  }
}
async function insertImages(files) {
  const ta = $('edBody');
  if (!ta) return;
  for (const f of files) {
    if (f.type && !f.type.startsWith('image/')) continue;
    try {
      const id = await putImage(await compressImage(f));
      if (!ta.isConnected) return;
      const s = ta.selectionStart, e = ta.selectionEnd;
      const txt = `${s > 0 && ta.value[s - 1] !== '\n' ? '\n' : ''}![](img:${id})\n`;
      replaceRange(ta, s, e, txt, s + txt.length, s + txt.length);
    } catch (err) {
      alert('Could not add image: ' + (err && err.message || err));
    }
  }
}
function docClick(e) {
  const mb = e.target.closest('[data-md]');
  if (mb) return mdAction(mb.dataset.md);
  const box = e.target.closest('.tbox');
  if (box && !doc.edit) {
    const r = docRec();
    if (!r) return;
    const lines = String(r.content || '').split('\n'), i = +box.dataset.line;
    if (lines[i] === undefined) return;
    lines[i] = lines[i].replace(/\[([ xX])\]/, m => m === '[ ]' ? '[x]' : '[ ]');
    r.content = lines.join('\n');
    r.updated = Date.now();
    save(); render();
  }
}

/* ---------- modal form ---------- */
function fieldHTML(f) {
  const v = form.values[f.key] ?? '';
  const ph = esc(f.placeholder || '');
  let input;
  if (f.type === 'seg') {
    input = `<div class="seg" data-seg="${f.key}">${f.options.map(([val, lab]) => `<button type="button" data-val="${esc(val)}" class="${val === v ? 'on' : ''}">${esc(lab)}</button>`).join('')}</div>`;
  } else if (f.type === 'number') {
    input = `<input id="f-${f.key}" type="number" inputmode="decimal" step="any" min="0" value="${esc(v)}" placeholder="${ph}">`;
  } else if (f.type === 'date') {
    input = `<input id="f-${f.key}" type="date" value="${esc(v)}">`;
  } else {
    const extra = f.url ? ' inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"' : '';
    input = `<input id="f-${f.key}" type="text" value="${esc(v)}" placeholder="${ph}"${extra}>`;
  }
  return `<div class="field" data-field="${f.key}"><label${f.type === 'seg' ? '' : ` for="f-${f.key}"`}>${esc(f.label)}</label>${input}</div>`;
}
function readForm() {
  for (const f of form.fields) {
    if (f.type === 'seg') continue;
    const el = $('f-' + f.key);
    if (el) form.values[f.key] = el.value;
  }
}
function syncForm() {
  for (const f of form.fields) {
    if (f.showIf) $('fields').querySelector(`[data-field="${f.key}"]`).hidden = !f.showIf(form.values);
  }
}
function openForm(cfg) {
  form = { ...cfg, values: { ...cfg.values } };
  $('sheetTitle').textContent = cfg.title;
  $('fields').innerHTML = cfg.fields.map(fieldHTML).join('');
  $('delBtn').hidden = !cfg.onDelete;
  syncForm();
  $('mask').classList.add('show');
  const first = $('fields').querySelector('input[type=text]');
  if (first && !first.value) first.focus();
}
function closeForm() { $('mask').classList.remove('show'); form = null; }
$('fields').addEventListener('click', e => {
  const b = e.target.closest('.seg button');
  if (!b || !form) return;
  const seg = b.parentElement;
  form.values[seg.dataset.seg] = b.dataset.val;
  seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  readForm(); syncForm();
});
$('sheet').addEventListener('submit', e => {
  e.preventDefault();
  if (!form) return;
  readForm();
  const v = {};
  for (const f of form.fields) {
    const hiddenField = f.showIf && !f.showIf(form.values);
    const x = String(form.values[f.key] ?? '').trim();
    if (f.required && !x && !hiddenField) return alert(`${f.label} is required`);
    v[f.key] = f.type === 'number' ? (x === '' ? 0 : Number(x)) : x;
  }
  const err = form.onSave(v);
  if (err) return alert(err);
  save(); closeForm(); render();
});
$('cancelBtn').onclick = closeForm;
$('delBtn').onclick = () => {
  if (!form || !form.onDelete) return;
  if (!confirm(form.deleteMsg || "Delete this? This can't be undone.")) return;
  form.onDelete();
  save(); closeForm(); render();
};

/* ---------- render ---------- */
const VIEWS = { todos: viewTodos, notes: viewNotes, progress: viewProgress, journal: viewJournal, bookmarks: viewBookmarks, countdowns: viewCountdowns };
function subtitle(tab) {
  const td = today(), n = k => db[k].length;
  switch (tab) {
    case 'todos': return `${fmtLong(td)} · W${isoWeek(td)}`;
    case 'notes': return `${n('notes')} NOTES`;
    case 'progress': return `${n('folders')} FOLDERS`;
    case 'journal': return `${n('journal')} ENTRIES`;
    case 'bookmarks': return `${n('bookmarks')} LINKS`;
    case 'countdowns': return `${db.countdowns.filter(c => validDate(c.date) && diffDays(td, c.date) >= 0).length} UPCOMING`;
  }
}
function renderNav() {
  const td = today(), wk = mondayOf(td);
  const counts = {
    todos: db.todos.filter(t => ['overdue', 'today', 'week'].includes(bucket(t, td, wk))).length,
    notes: db.notes.length, progress: db.folders.length, journal: 0, bookmarks: db.bookmarks.length,
    countdowns: db.countdowns.filter(c => validDate(c.date) && diffDays(td, c.date) >= 0).length,
  };
  $('nav').innerHTML = TABS.map(([k, name]) => `<button class="nav-btn ${k === ui.tab ? 'active' : ''}" data-tab="${k}"><span>${name}</span>${counts[k] ? `<span class="n">${counts[k]}</span>` : ''}</button>`).join('');
}
function renderBackupHint() {
  const t = +localStorage.getItem(EXPORT_KEY), el = $('backupHint');
  if (!t) { el.textContent = 'Never backed up'; el.classList.add('warn'); return; }
  const n = Math.floor((Date.now() - t) / 86400000);
  el.textContent = n === 0 ? 'Backed up today' : `Last backup: ${n}d ago`;
  el.classList.toggle('warn', n >= 7);
}
function render() {
  renderNav();
  renderBackupHint();
  if (doc) return renderDoc();
  const t = ui.tab;
  $('title').textContent = TAB_NAME[t];
  $('sub').textContent = subtitle(t);
  $('headActions').innerHTML = '<button class="plus" data-act="new" aria-label="New"></button>';
  $('searchBar').hidden = !(t === 'notes' || t === 'journal');
  $('list').innerHTML = VIEWS[t]();
}

/* ---------- events ---------- */
function newItem() {
  switch (ui.tab) {
    case 'todos': return todoForm(null);
    case 'notes': {
      const n = { id: uid(), title: '', tag: '', content: '', created: Date.now(), updated: Date.now() };
      db.notes.push(n);
      return openDoc('notes', n.id, true, true);
    }
    case 'progress': return folderForm(null);
    case 'journal': return journalPick();
    case 'bookmarks': return bookmarkForm(null);
    case 'countdowns': return countdownForm(null);
  }
}

$('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  if (doc) closeDoc();
  ui.tab = b.dataset.tab;
  saveUI();
  $('search').value = '';
  $('scroll').scrollTop = 0;
  render();
});

$('headActions').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'new') return newItem();
  if (!doc) return;
  if (act === 'back') { closeDoc(); return render(); }
  if (act === 'edit') { doc.edit = true; return render(); }
  if (act === 'read') { flushSave(); doc.edit = false; $('scroll').scrollTop = 0; return render(); }
  if (act === 'delDoc') {
    if (!confirm("Delete this? This can't be undone.")) return;
    const r = docRec();
    db[doc.kind] = db[doc.kind].filter(x => x !== r);
    doc = null;
    save(); render();
  }
});

$('list').addEventListener('click', e => {
  if (doc) return docClick(e);
  const actEl = e.target.closest('[data-act]');
  const act = actEl ? actEl.dataset.act : null;
  const tab = ui.tab;
  const row = e.target.closest('.row[data-id]');

  if (tab === 'todos') {
    if (act === 'allToday') {
      const td = today(), wk = mondayOf(td);
      db.todos.filter(x => bucket(x, td, wk) === 'overdue').forEach(moveToToday);
      save(); return render();
    }
    if (act === 'toggleDone') { ui.doneOpen = !ui.doneOpen; saveUI(); return render(); }
    if (!row) return;
    const t = db.todos.find(x => x.id === row.dataset.id);
    if (!t) return;
    if (act === 'check') {
      t.done = !t.done;
      t.doneDate = t.done ? today() : null;
      t.doneAt = t.done ? Date.now() : 0;
      save(); return render();
    }
    if (act === 'toToday') { moveToToday(t); save(); return render(); }
    if (act === 'drop') {
      if (confirm('Drop this to-do?')) { db.todos = db.todos.filter(x => x !== t); save(); render(); }
      return;
    }
    return todoForm(t);
  }

  if (tab === 'progress') {
    const fe = e.target.closest('.folder');
    if (!fe) return;
    const f = db.folders.find(x => x.id === fe.dataset.fid);
    if (!f) return;
    if (act === 'fadd') return itemForm(f, null);
    if (act === 'fedit') return folderForm(f);
    if (act === 'fold') { f.open = !f.open; save(); return render(); }
    if (!row) return;
    const it = f.items.find(x => x.id === row.dataset.id);
    if (!it) return;
    if (act === 'inc' || act === 'dec') {
      const total = +it.total || 0;
      it.current = Math.max(0, Math.min(total, (+it.current || 0) + (act === 'inc' ? 1 : -1)));
      save(); return render();
    }
    return itemForm(f, it);
  }

  if (tab === 'journal') {
    if (act === 'writeToday') return openJournal(today());
    if (row) openDoc('journal', row.dataset.id);
    return;
  }
  if (!row) return;
  const id = row.dataset.id;
  if (tab === 'notes') return openDoc('notes', id);
  if (tab === 'bookmarks') {
    const b = db.bookmarks.find(x => x.id === id);
    if (!b) return;
    if (act === 'edit') return bookmarkForm(b);
    const u = safeHref(b.url);
    if (u) window.open(u, '_blank', 'noopener');
    return;
  }
  if (tab === 'countdowns') {
    const c = db.countdowns.find(x => x.id === id);
    if (c) countdownForm(c);
  }
});

// autosave while typing in a note / journal entry
$('list').addEventListener('input', e => {
  if (!doc || !doc.edit) return;
  const r = docRec();
  if (!r) return;
  const id = e.target.id;
  if (id === 'edBody') { r.content = e.target.value; autosize(e.target); }
  else if (id === 'edTitle') r.title = e.target.value;
  else if (id === 'edTag') r.tag = e.target.value;
  else return;
  r.updated = Date.now();
  queueSave();
});

// paste images straight into the editor
$('list').addEventListener('paste', e => {
  if (!doc || !doc.edit || e.target.id !== 'edBody') return;
  const items = e.clipboardData ? [...e.clipboardData.items] : [];
  const files = items.filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  if (!files.length) return;
  e.preventDefault();
  insertImages(files);
});
$('imgInput').onchange = e => {
  const files = [...e.target.files];
  e.target.value = '';
  insertImages(files);
};

$('search').addEventListener('input', () => {
  if (!doc) $('list').innerHTML = VIEWS[ui.tab]();
});

/* ---------- export / import ---------- */
let pendingExport = null;
async function buildBackup() {
  flushSave();
  const ids = new Set();
  const scan = s => { for (const m of String(s || '').matchAll(/img:([\w-]+)/g)) ids.add(m[1]); };
  db.notes.forEach(n => scan(n.content));
  db.journal.forEach(j => scan(j.content));
  const images = {};
  for (const id of ids) { const v = await getImage(id); if (v) images[id] = v; }
  return { app: 'clawd', version: 2, exportedAt: new Date().toISOString(), data: db, images };
}
function closeExport() { $('exportMask').classList.remove('show'); pendingExport = null; }

$('exportBtn').onclick = async () => {
  try {
    const data = await buildBackup();
    const json = JSON.stringify(data);
    const name = `clawd-backup-${today()}.json`;
    pendingExport = new File([json], name, { type: 'application/json' });
    const kb = json.length / 1024;
    const size = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.ceil(kb) + ' KB';
    const n = Object.keys(data.images).length;
    $('exportMsg').innerHTML = `${esc(name)}<br>${size} · ${n} image${n === 1 ? '' : 's'}<br><br>In the share sheet, choose "Save to Files".`;
    $('exportMask').classList.add('show');
  } catch (err) {
    alert('Export failed: ' + (err && err.message || err));
  }
};
$('exportCancel').onclick = closeExport;
$('exportSave').onclick = async () => {
  const file = pendingExport;
  if (!file) return;
  const done = () => { localStorage.setItem(EXPORT_KEY, Date.now()); renderBackupHint(); closeExport(); };
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return done(); }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  done();
};

$('importBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let parsed;
  try { parsed = JSON.parse(await f.text()); }
  catch { return alert("Can't read this file. Pick a .json backup exported from this app."); }
  const isV2 = parsed && parsed.app === 'clawd';
  const next = isV2 ? normalize(parsed.data) : normalize(migrateV1(parsed));
  const images = isV2 && parsed.images && typeof parsed.images === 'object' ? parsed.images : {};
  const count = ['todos', 'notes', 'folders', 'journal', 'bookmarks', 'countdowns'].reduce((s, k) => s + next[k].length, 0);
  if (!count) return alert('No records found in this file.');
  if (!confirm(`This backup has ${count} records.\nImporting replaces everything in the app now. Continue?`)) return;
  try {
    for (const [id, v] of Object.entries(images)) {
      if (/^[\w-]+$/.test(id) && typeof v === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(v)) {
        await store.put('images', id, v);
        imgCache.set(id, v);
      }
    }
    doc = null;
    db = next;
    await save();
    render();
    alert('Import done.');
  } catch (err) {
    alert('Import failed: ' + (err && err.message || err));
  }
};

/* ---------- start ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) flushSave();
  else if (!(doc && doc.edit)) render(); // refresh dates when coming back next day
});
window.addEventListener('pagehide', flushSave);

async function init() {
  try {
    const saved = await store.get('kv', 'db');
    if (saved) db = normalize(saved);
    else {
      const old = localStorage.getItem(OLD_KEY);
      if (old) { db = normalize(migrateV1(safeJSON(old))); await save(); }
    }
  } catch (e) {
    alert('Could not open storage. Data will not be saved this session.\n' + (e && e.message || e));
  }
  if (!TAB_NAME[ui.tab]) ui.tab = 'todos';
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();
</script>
</body>
</html>
